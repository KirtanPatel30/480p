{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:0 auto">
  <h1>Login</h1>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Login</button>
  </form>
  <p style="margin-top:14px;font-size:0.88rem">
    New client? <a href="{{ url_for('register_client') }}">Register</a> &nbsp;|&nbsp;
    Admin? <a href="{{ url_for('register_admin') }}">Register</a>
  </p>
</div>
{% endblock %}
