{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:0 auto">
  <h1>Register — Admin</h1>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <label>Role</label>
    <input type="text" name="admin_role" placeholder="e.g. General Manager" required>
    <button class="btn" type="submit">Create Admin Account</button>
  </form>
  <p style="margin-top:14px;font-size:0.88rem"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
